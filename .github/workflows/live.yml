# SPDX-License-Identifier: BSD-2-Clause
#
# Nightly contract run against the live API with a read-only CI key. It never
# runs for pull requests (so never for forks) and skips when the secret is
# absent.
name: Live

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Contract run against api.oureawx.com
    if: github.repository == 'Ourea-Technologies/ensemble-weather-go'
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      HAS_KEY: ${{ secrets.OUREA_CI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: spectest/go.sum
      - name: Quickstart (anonymous)
        if: env.HAS_KEY == 'true'
        run: go run ./examples/quickstart
      - name: Contract tests (read-only key)
        if: env.HAS_KEY == 'true'
        env:
          OUREA_LIVE_API_KEY: ${{ secrets.OUREA_CI_API_KEY }}
        run: go test -tags live -count=1 -run '^TestLive' -v .
