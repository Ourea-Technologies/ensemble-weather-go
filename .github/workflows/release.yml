# SPDX-License-Identifier: BSD-2-Clause
#
# A tag is the release: Go modules are fetched from the repository through the
# vanity path oureawx.com/go/ensemble-weather, so nothing is uploaded to a
# registry. This re-runs the gates, publishes the GitHub release with the
# changelog section, a source archive and its build-provenance attestation,
# and warms the module proxy so pkg.go.dev lists the version.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # a release never restores a cache
      - name: The tag matches Version in version.go
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' version.go)
          [ "v$version" = "$TAG" ] || { echo "tag $TAG != version.go v$version"; exit 1; }
      - name: Every gate
        run: scripts/check

  release:
    name: GitHub release
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC token for attestation and publishing
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source archive
        env:
          TAG: ${{ github.ref_name }}
        run: git archive --format=tar.gz --prefix="ensemble-weather-go-$TAG/" -o "ensemble-weather-go-$TAG.tar.gz" "$TAG"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ensemble-weather-go-*.tar.gz
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "ensemble-weather-go-$TAG.tar.gz"

  proxy:
    name: Warm the module proxy
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # Needs the vanity meta tag at https://oureawx.com/go/ensemble-weather?go-get=1 (see CONTRIBUTING.md).
      - name: proxy.golang.org fetches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: GOPROXY=proxy.golang.org go list -m "oureawx.com/go/ensemble-weather@$TAG"
