name: Feature request
description: Suggest an addition or change to the Go SDK.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, not the solution. If it needs a new statistic, it may belong in the API (the server computes every probability).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
